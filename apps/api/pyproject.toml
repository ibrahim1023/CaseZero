[project]
name = "casezero-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "casezero-evidence",
  "casezero-ntsb",
  "fastapi>=0.116.1",
  "typer>=0.16.0",
]

[project.scripts]
casezero = "casezero_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casezero_api"]
