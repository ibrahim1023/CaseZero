[project]
name = "casezero-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "casezero-evidence",
    "docling==2.120.2",
    "fastexcel==0.20.2",
    "pillow==12.3.0",
    "polars==1.43.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casezero_ingestion"]
