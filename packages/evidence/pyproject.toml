[project]
name = "casezero-evidence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "psycopg[binary]>=3.2.9", "pydantic>=2.11.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casezero_evidence"]
