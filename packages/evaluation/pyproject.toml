[project]
name = "casezero-evaluation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["casezero-evidence", "pydantic>=2.11.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casezero_evaluation"]

[tool.uv.sources]
casezero-evidence = { workspace = true }
