[project]
name = "casezero"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "casezero-api",
  "casezero-evidence",
  "casezero-evaluation",
  "casezero-ingestion",
  "casezero-investigation",
  "casezero-ntsb",
  "casezero-observability",
  "casezero-retrieval",
]

[tool.uv.workspace]
members = ["packages/evidence", "packages/evaluation", "packages/ingestion", "packages/investigation", "packages/retrieval", "packages/ntsb", "packages/observability", "apps/api"]

[tool.uv.sources]
casezero-api = { workspace = true }
casezero-evidence = { workspace = true }
casezero-evaluation = { workspace = true }
casezero-ingestion = { workspace = true }
casezero-investigation = { workspace = true }
casezero-ntsb = { workspace = true }
casezero-observability = { workspace = true }
casezero-retrieval = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.17.1",
  "openai==2.45.0",
  "pydantic-ai-slim[openai]==2.30.0",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "respx>=0.22.0",
  "ruff>=0.12.8",
  "types-pyyaml>=6.0.12.20250822",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
packages = ["casezero_evidence", "casezero_evaluation", "casezero_ingestion", "casezero_investigation", "casezero_retrieval", "casezero_ntsb", "casezero_observability", "casezero_api"]
