[project]
name = "casezero"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "casezero-api",
  "casezero-evidence",
  "casezero-ntsb",
]

[tool.uv.workspace]
members = ["packages/evidence", "packages/ntsb", "apps/api"]

[tool.uv.sources]
casezero-api = { workspace = true }
casezero-evidence = { workspace = true }
casezero-ntsb = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.17.1",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "respx>=0.22.0",
  "ruff>=0.12.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["casezero_evidence", "casezero_ntsb", "casezero_api"]
